# Yazi file opener config (nix-managed via modules/common/yazi.nix — do not
# edit in ~/.config). Audio files are handed to the yazi-cmus helper, which
# queues the file into cmus AND starts playback (auto-starting the cmus
# daemon in a terminal first if none is running). A bare `cmus-remote -q`
# only enqueues and leaves the player stopped. Everything else keeps yazi's
# default openers (prepend keeps our rule first).

[opener]
cmus = [
	{ run = 'yazi-cmus "%s"', orphan = true, desc = "Play in cmus" },
]

[open]
prepend_rules = [
	{ url = "*.{mp3,flac,ogg,oga,opus,wav,wave,aiff,aif,caf,m4a,m4b,aac,wma,wv,ape,mpc,mka,alac}", use = "cmus" },
]
